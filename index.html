<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="120">
  <title>Flottenstatus</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #fff;
      overflow: hidden;
    }
    img {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      cursor: zoom-in;
    }
    /* Klick: Originalgröße mit Scrollen */
    body.zoom { overflow: auto; }
    body.zoom img {
      width: auto;
      height: auto;
      max-width: none;
      object-fit: none;
      cursor: zoom-out;
    }
  </style>
</head>
<body>
  <img id="bild" alt="Flottenstatus">
  <script>
    var img = document.getElementById('bild');
    img.src = 'flotte_status.png?t=' + Date.now();
    img.addEventListener('click', function () {
      document.body.classList.toggle('zoom');
    });
  </script>
</body>
</html>
