<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Flottenstatus v4</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    #bild {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-repeat: no-repeat;
      background-position: center center;
      background-size: contain;
    }
  </style>
</head>
<body>
  <div id="bild"></div>
  <script>
    var el = document.getElementById('bild');
    var alteUrl = null;

    function laden() {
      fetch('flotte_status.png?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.blob(); })
        .then(function (b) {
          var neu = URL.createObjectURL(b);
          el.style.backgroundImage = "url('" + neu + "')";
          if (alteUrl) URL.revokeObjectURL(alteUrl);
          alteUrl = neu;
        })
        .catch(function () { /* beim nächsten Durchlauf erneut versuchen */ });
    }

    laden();
    setInterval(laden, 60000);
  </script>
</body>
</html>
